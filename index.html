<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEGIS - Global Green Energy GIS Portal</title>
   
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
   
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
   
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Control Panel -->
    <div id="sidebar">
        <!-- Language Switcher Header -->
        <div class="header-top">
            <h2 id="app-title">GEGIS ☀️</h2>
            <button id="lang-btn" onclick="toggleLanguage()">العربية</button>
        </div>
       
        <p class="subtitle" id="app-subtitle">Solar Power Site Suitability & Solar Radiation Analysis Platform</p>
        <hr>

        <!-- Layer Control Section -->
        <div class="section">
            <h3 id="layers-header">Spatial Layers</h3>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-solar" checked>
                <span id="label-solar">Solar Irradiation Index (GHI)</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-slope" checked>
                <span id="label-slope">Terrain & Slope Constraint</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-grid" checked>
                <span id="label-grid">Power Grid & Infrastructure</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-sites" checked>
                <span id="label-sites">Optimal Solar Plant Sites</span>
            </label>
        </div>

        <!-- Info Card -->
        <div class="section info-box">
            <h3 id="info-header">Location Details</h3>
            <p id="site-info">Click anywhere on the map or select a feature to view solar potential, slope degree, and site suitability criteria.</p>
        </div>

        <!-- Developer Footer Section (التوقيع الملكي) -->
        <div class="sidebar-footer">
            <p id="dev-credit">Designed & Developed by <strong>Shahd Saif</strong></p>
            <p class="copyright">&copy; 2026 GEGIS. All rights reserved.</p>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Esri Leaflet (for ArcGIS REST API) -->
    <script src="https://unpkg.com/esri-leaflet@3.0.12/dist/esri-leaflet.js"></script>
   
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
