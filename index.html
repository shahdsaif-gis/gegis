<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEGIS - Solar Site Suitability Platform</title>
   
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
   
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
</head>
<body>

    <!-- زر القائمة للتلفون -->
    <button id="toggle-btn" onclick="toggleSidebar()">☰</button>

    <!-- Sidebar Control Panel -->
    <div id="sidebar">
        <!-- Language Switcher Header -->
        <div class="header-top">
            <h2 id="app-title">GEGIS ☀️</h2>
            <button id="lang-btn" onclick="toggleLanguage()">العربية</button>
        </div>
       
        <p class="subtitle" id="app-subtitle">Solar Power Site Suitability & Solar Radiation Analysis</p>
        <hr>

        <!-- Layer Control Section -->
        <div class="section">
            <h3 id="layers-title">Spatial Layers</h3>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-ghi" checked>
                <span id="label-ghi">Global Horizontal Irradiance (GHI)</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-terrain" checked>
                <span id="label-terrain">Terrain & Slope Constraints</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-grid" checked>
                <span id="label-grid">Power Grid & Infrastructure</span>
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="layer-sites" checked>
                <span id="label-sites">Optimal Solar Farm Sites</span>
            </label>
        </div>

        <!-- Info & Analysis Panel -->
        <div class="section info-card">
            <h3 id="info-title">Site Details</h3>
            <div id="site-info">
                <p id="click-prompt">Click anywhere on the map to analyze solar suitability and radiation.</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p><span id="designed-by">Designed & Developed by:</span> <strong>Shahd Saif</strong></p>
            <p>© 2026 GEGIS. All rights reserved.</p>
        </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Custom JS -->
    <script src="app.js"></script>
</body>
</html>
