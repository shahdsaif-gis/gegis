<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEGIS - المنظومة الجغرافية والتحليل المناخي</title>
    <!-- CSS الخاص بالخريطة Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- مكتبة الأيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- الملف التنسيقي المخصص -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- زر فتح/إغلاق القائمة الجانبية للهواتف -->
    <button id="menuToggle" class="menu-toggle">
        <i class="fa-solid fa-bars"></i>
    </button>

    <div class="app-container">
        <!-- اللوحة الجانبية -->
        <aside id="sidebar" class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-solar-panel logo-icon"></i>
                <h2>GEGIS Analytics</h2>
            </div>

            <!-- معلومات الموقع المحدد -->
            <div class="info-card">
                <h3><i class="fa-solid fa-location-dot"></i> الموقع المحدد</h3>
                <p>خط العرض: <span id="latVal">-</span></p>
                <p>خط الطول: <span id="lngVal">-</span></p>
            </div>

            <!-- البيانات المناخية -->
            <div class="info-card">
                <h3><i class="fa-solid fa-cloud-sun"></i> البيانات المناخية (Open-Meteo)</h3>
                <p>الإشعاع الشمسي: <span id="solarVal">-</span> <small>kWh/m²/day</small></p>
                <p>أقصى سرعة للرياح: <span id="windVal">-</span> <small>km/h</small></p>
            </div>

            <!-- أدوات الحساب الهندسي -->
            <div class="calc-card">
                <h3><i class="fa-solid fa-calculator"></i> حاسبة محطة الطاقة الشمسية</h3>
                <label for="areaInput">مساحة الأرض المتاحة (م²):</label>
                <input type="number" id="areaInput" placeholder="مثال: 5000" min="100">
                <button id="calcBtn" class="btn-primary">
                    <i class="fa-solid fa-chart-line"></i> إنشاء التقرير الهندسي
                </button>
            </div>

            <!-- التقرير الهندسي المتوقع -->
            <div id="reportSection" class="report-card" style="display: none;">
                <h3><i class="fa-solid fa-file-invoice"></i> نتائج التقرير التقديري</h3>
                <div class="report-item">
                    <span>السعة المقترحة:</span>
                    <strong id="rCapacity">-</strong>
                </div>
                <div class="report-item">
                    <span>عدد الألواح المتوقع:</span>
                    <strong id="rPanels">-</strong>
                </div>
                <div class="report-item">
                    <span>الإنتاج السنوي المتوقع:</span>
                    <strong id="rGen">-</strong>
                </div>
                <div class="report-item">
                    <span>خفض الانبعاثات (CO2):</span>
                    <strong id="rOffset">-</strong>
                </div>
            </div>
        </aside>

        <!-- حاوية الخريطة -->
        <main class="map-container">
            <div id="map"></div>
        </main>
    </div>

    <!-- مكتبة Leaflet للخريطة -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- مكتبات Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- الملف البرمجي الخاص بالموقع -->
    <script src="app.js"></script>
</body>
</html>
