<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - GEGIS Analytics</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-header">
            <i class="fa-solid fa-solar-panel login-icon"></i>
            <h2>GEGIS Analytics</h2>
            <p>منظومة التحليل المكاني لمشاريع الطاقة الشمسية</p>
        </div>
       
        <form id="loginForm" class="login-form">
            <div class="input-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="example@domain.com">
            </div>
           
            <div class="input-group">
                <label for="password"><i class="fa-solid fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <button type="submit" id="loginBtn" class="btn-login">
                <span>تسجيل الدخول</span>
                <i class="fa-solid fa-right-to-bracket"></i>
            </button>
        </form>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="login.js"></script>
</body>
</html>
